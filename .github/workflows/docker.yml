name: Docker Nginx Lab

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  docker:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Normalize DockerHub username (must be lowercase or the auth header is malformed)
      - name: Normalize DockerHub username
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: echo "DOCKER_USERNAME_LC=${DOCKER_USERNAME,,}" >> "$GITHUB_ENV"

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME_LC }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Image
      - name: Build Docker image
        run: docker build -t mynginx:test .

      # Test Image
      - name: Test Docker image
        run: |
          docker run -d -p 8080:80 --name test-nginx mynginx:test
          sleep 5
          curl http://localhost:8080 | grep "Hello from GitHub Actions"
          docker stop test-nginx

      # Push Image
      - name: Push to DockerHub
        run: |
          docker tag mynginx:test ${{ env.DOCKER_USERNAME_LC }}/mynginx:latest
          docker push ${{ env.DOCKER_USERNAME_LC }}/mynginx:latest
